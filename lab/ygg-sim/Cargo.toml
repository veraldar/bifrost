[package]
name = "ygg-sim"
version = "0.3.0"
edition = "2024"

[dependencies]
base64 = "0.23"
opus = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
str0m = "0.24.0"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
