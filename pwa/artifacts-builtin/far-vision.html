<title>the far vision — many trees, one phone</title>
<!--
  THE FAR VISION — veraldar.org's film (#&film), FILM-V1 10-22. Grown from
  the artifact the user loves (artifacts/js-movie-far-vision.html): the same
  line drawings, the multi-tree story — the workshop at dusk, the desk builds,
  every computer its own tree with its own root, one private line, the work
  moves to the tv, nothing goes public, the world — told in the door's names
  (tree = a computer, root = its brain, the private line, bifrost = the app in
  your hand) and its colors (green = alive/speaking, sky = the private line,
  amber ONLY when you are heard), in the door's own pre-recorded voice
  (/onboarding/<lang>/fv_*.mp3 — lines in pwa/lib/onboard-script.json, copies
  below; e2e checks they match). A film: it plays by itself, chapters jump,
  pause holds; the parent's ✕ skips. It ends on your tree: hold it, let go —
  the site's door opens ({film:'door'}).
  Honest: a short film, the replies written ahead; what is still being built
  is marked growing. No dead air: lines are asked for a chapter ahead — from
  the parent's memory ({voice:'need'} → ack → {voice:'line', blob}; a
  sandboxed frame can't fetch the pack), else fetched here, else played from
  their address. Each line's drawing starts WITH its voice; until then the
  rail glides and past 0.7 s the words say so. ?lang=fr · ?ch=<1-7>.
  Built in (pwa/artifacts-builtin) → /api/artifact/far-vision.html; copied to
  veraldar.org/onboarding/far-vision.html by scripts/onboard-voice-site.sh.
-->
<style>
:root{
  --bg:#080810; --hi:#e9e7e3; --fg:#8a8a90; --line:rgba(255,255,255,.13);
  --ok:#4ade80; --sky:#38bdf8; --amber:#fbbf24; --sun:#b98b4e;
  --mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  --cup:var(--fg);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--hi);font:13px/1.5 var(--mono);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);cursor:pointer}
#f{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;max-width:620px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@media (min-width:700px){#f{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* top bar — the mark, the chapter, the voice's eq */
#top{display:flex;align-items:center;gap:12px;height:40px;padding:0 96px 0 16px;font-size:11px;color:var(--fg);border-bottom:1px solid var(--line)}
#top .mark{color:var(--hi)}
#top .cur{animation:blink 1.1s steps(1,end) infinite}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eq{display:flex;align-items:flex-end;gap:2px;height:11px}
#eq i{display:block;width:2px;height:11px;background:var(--fg);opacity:.5;transform:scaleY(.3);transform-origin:bottom}
[data-voice=speaking] #eq i{background:var(--ok);opacity:1;animation:eq .7s ease-in-out infinite}
.heard #eq i{background:var(--amber)!important;opacity:1;animation:eq .5s ease-in-out infinite}
#eq i:nth-child(2){animation-delay:.12s!important}#eq i:nth-child(3){animation-delay:.24s!important}#eq i:nth-child(4){animation-delay:.36s!important}
[data-voice=speaking]{--cup:var(--ok)}
.heard{--cup:var(--amber)!important}

/* the stage: one scene at a time */
#stage{position:relative;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px 12px;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.scene.now{opacity:1;visibility:visible;transition:opacity .7s ease}
.scene svg{width:100%;height:100%;max-height:100%;display:block}
.scene text{font-family:var(--mono);font-size:10px;fill:var(--fg)}
.s9{font-size:9px!important}.s12{font-size:12px!important}.s14{font-size:14px!important}
.th{fill:var(--hi)!important}.tok{fill:var(--ok)!important}.tsky{fill:var(--sky)!important}.tam{fill:var(--amber)!important}
.ln-d{stroke:var(--fg);fill:none;stroke-width:1.5}
.ln-f{stroke:var(--fg);fill:none;stroke-width:1.2;opacity:.35}
.ln-h{stroke:var(--hi);fill:none;stroke-width:1.5}
.ln-ok{stroke:var(--ok);fill:none;stroke-width:1.6}
.ln-sky{stroke:var(--sky);fill:none;stroke-width:1.6}
.ln-sun{stroke:var(--sun);fill:none;stroke-width:1.6}
.fo{fill:var(--ok);stroke:none}.ff{fill:var(--fg);stroke:none}
.hair{stroke:var(--line);stroke-width:1;fill:none}
.panel{fill:#0b0b12;stroke:rgba(255,255,255,.14);stroke-width:1}
.crisp{shape-rendering:crispEdges}
use.cr{color:var(--fg);transition:color 1s ease}
use.rt{color:var(--fg);opacity:.6;transition:color 1s ease,opacity 1s ease}
use.cr.on,.lit use.cr{color:var(--hi)}
use.rt.on,.lit use.rt{color:var(--ok);opacity:1}
use.person{color:var(--hi);opacity:.9}
.phone-r{stroke:var(--fg);fill:none;stroke-width:1.6;transition:stroke .2s}
.phone-r.on{stroke:var(--hi)}
.heard .phone-r{stroke:var(--amber)}
.waves{opacity:0;stroke:var(--amber);fill:none;stroke-width:1.6}
.heard .waves{animation:pulse .9s ease-in-out infinite}

/* cue-driven reveals: JS adds .on to [data-on] (and c-<cue> to the scene) */
.rv{opacity:0;transition:opacity .8s ease}
.rv.on{opacity:1}
.rv.d1{transition-delay:.7s}.rv.d2{transition-delay:1.4s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s ease}
.draw.on{stroke-dashoffset:0}
.rv.on.pulse,.pulse:not(.rv){animation:pulse 1.2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.sun{transition:transform 7s ease}
.c-dusk .sun{transform:translateY(14px)}
.dusk-sky{transition:opacity 5s ease}
.c-dusk .dusk-sky{opacity:.12}
.steam path{animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1s}.steam path:nth-child(3){animation-delay:2s}
.prog{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform 1.6s ease}
.prog.on{transform:scaleX(1)}
.glow{opacity:0;transition:opacity 1s}.glow.on{opacity:.08}
.pk{opacity:0}
.c-pull .pk{animation:travel 1.8s ease-in-out .2s forwards}
.typed{fill:var(--amber)!important}
/* the world: the grove gives way to the mark, then black and the manifesto */
.grove{transition:opacity 1.4s ease}
.c-world .grove{opacity:.25}
.mark-g,.lic{transition:opacity 1.2s ease}
.blackout{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;padding:0 24px;text-align:center;background:var(--bg);opacity:0;pointer-events:none;transition:opacity 1s ease}
.c-black .blackout{opacity:1}
.manifesto{font-size:15px;color:var(--hi);min-height:1.5em}
.manifesto .cur{color:var(--amber)}
.endcard{font-size:11px;color:var(--fg);opacity:0;transition:opacity 1.4s ease}
.endcard b{color:var(--hi);font-weight:400}
.c-endcard .endcard{opacity:1}
/* the door: your tree — hold = amber (heard), let go = the door opens */
#doortree{cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
#doortree use.cr{color:var(--hi)}
.heard #doortree use.cr,.heard #doortree use.rt{color:var(--amber);opacity:1}
.heard #doortree{filter:drop-shadow(0 0 10px rgba(251,191,36,.45))}
body:not(.heard) .s-door.try #doortree .cr{animation:pulse 1.6s ease-in-out infinite}

/* the start card */
.card{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:0 22px;text-align:center}
.card h1{margin-top:14px;font-size:22px;font-weight:400;letter-spacing:.02em}
.card .sub{color:var(--fg)}
.card .note{max-width:34ch;margin-top:14px;font-size:11px;color:var(--fg)}
.card .go{margin-top:18px;min-height:44px;padding:0 20px;background:var(--hi);color:var(--bg);border-color:var(--hi);letter-spacing:.12em;font-size:12px}
.card .go[hidden]{display:none}

/* the voice, honest: loading = a signal glides the rail; speaking = it breathes green */
#rail{position:relative;height:2px;overflow:hidden;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
#rail::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;background:linear-gradient(90deg,transparent,var(--ok),transparent);opacity:0}
[data-voice=loading] #rail::after{opacity:1;animation:glide 1.5s ease-in-out infinite}
[data-voice=speaking] #rail{background:color-mix(in srgb,var(--ok) 65%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 30%,transparent);animation:breathe 2.6s ease-in-out infinite}
.heard #rail{background:color-mix(in srgb,var(--amber) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--amber) 50%,transparent);animation:breathe 1.8s ease-in-out infinite}

/* captions + chapters */
#hud{display:grid;gap:8px;padding:12px 16px 14px}
#cap{min-height:4.6em;display:grid;align-content:end;gap:4px;font-size:14px;line-height:1.55}
#cap p{transition:opacity .3s}
#cap .prev{font-size:12px;opacity:.38}
#cap .now::before{content:"▸ ";color:var(--ok)}
#cap .you{color:var(--amber)}
#cap .you::before{content:"◉ ";color:var(--amber)}
#cap b{font-weight:400;color:var(--fg)}
[data-voice=loading] #cap .now{opacity:.55}
[data-voice=loading] #cap .now::before{animation:breathe 1.2s ease-in-out infinite}
#sub{min-height:1.5em;font-size:11px;color:var(--fg)}
#sub.hot{color:var(--amber)}
#sub.wait{animation:fadein .3s ease-out .7s both}
#nav{display:flex;align-items:center;gap:6px}
#ch{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#ch button{position:relative;height:28px;border:0;padding:0}
#ch button::before{content:"";position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line)}
#ch button.done::before{background:var(--fg)}
#ch button.now::before{background:var(--hi)}
#ch button::after{content:"";position:absolute;left:0;top:12px;height:3px;width:var(--p,0%);background:var(--ok);transition:width .4s}
#ch button:focus-visible{outline:1px solid var(--hi);outline-offset:2px}
#ctl{display:flex;gap:6px}
#ctl button{min-height:36px;min-width:44px;padding:0 10px;font-size:12px;color:var(--fg)}
#ctl button[hidden]{display:none}
#ctl .go{background:var(--hi);color:var(--bg);border-color:var(--hi)}

@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}40%{opacity:.7}100%{transform:translateY(-9px);opacity:0}}
@keyframes travel{0%{transform:translateX(0);opacity:0}12%,88%{opacity:1}100%{transform:translateX(286px);opacity:0}}
@keyframes glide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  [data-voice=loading] #rail::after{left:31%;animation:none!important}
}
</style>

  const p = document.createElement('p');
  p.className = 'now' + (who === 'you' ? ' you' : '');
  if (who !== 'reader' && who !== 'type') {
    const b = document.createElement('b'); b.textContent = T.who[who] + ' › '; p.appendChild(b);
  }
  p.appendChild(document.createTextNode(who === 'you' ? '"' + text + '"' : text));
  capEl.appendChild(p);
  return p;
}
function chapters(){
  chEl.textContent = '';
  CH.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', (i + 1) + ' · ' + T.ch[i]);
    b.addEventListener('click', () => { paused = false; void playFrom(i, 0); });
    chEl.appendChild(b);
  });
}
function mark(c, b){
  [...chEl.children].forEach((el, i) => {
    el.classList.toggle('done', i < c); el.classList.toggle('now', i === c);
    el.setAttribute('aria-current', i === c ? 'step' : 'false');
    el.style.setProperty('--p', i < c ? '100%' : i === c ? Math.round(100 * b / CH[c].beats.length) + '%' : '0%');
  });
  titleEl.textContent = (c + 1) + ' · ' + T.ch[c];
}
function typeInto(el, text, my, cps){
  return new Promise(res => {
    let i = 0; el.textContent = '';
    const tick = () => {
      if (my !== run) return res();
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, RM ? 0 : (text[i - 1] === ',' ? 260 : cps)); else res();
    };
    setTimeout(tick, RM ? 0 : 250);
  });
}
/** you: hold the mic (amber, heard), the words type themselves, let go */
async function youSay(key, sec, cue, my){
  document.body.classList.add('heard'); voice('idle'); sub('');
  const p = caption('you', '');
  cueOn(sec, cue);
  const els = sec.querySelectorAll('[data-you="' + key + '"]');
  const text = T.you[key];
  await typeInto(p, '"' + text + '"', my, 38);
  els.forEach(el => { el.textContent = '› ' + text; });
  await wait(650);
  document.body.classList.remove('heard');
}
async function beat(c, b, my){
  const [who, id, cue] = CH[c].beats[b];
  const sec = $(CH[c].scene);
  mark(c, b);
  if (who === 'you') return youSay(id, sec, cue, my);
  if (who === 'type') {
    caption('type', ''); capEl.textContent = '';
    cueOn(sec, cue);
    await wait(1000); if (my !== run) return;
    await typeInto($('m1'), T.manifesto, my, 58); if (my !== run) return;
    await wait(700); if (my !== run) return;
    sec.classList.add('c-endcard');
    await wait(1800);
    return;
  }
  caption(who, T.lines[id]);
  const r = await say(id, () => { if (my === run) cueOn(sec, cue); });
  if (my !== run) return 'cut';
  return r;
}
/** play from chapter c, beat b (the beats before it in that scene drawn at once) */
async function playFrom(c, b){
  const my = ++run;
  if (cut) cut();
  ended = false; paused = false;
  document.body.classList.remove('heard', 'try');
  $('again').hidden = true; $('open').hidden = true; $('pause').hidden = false; $('pause').textContent = T.pause;
  $('play').hidden = true;
  sub('');
  for (let ci = c; ci < CH.length; ci++) {
    if (my !== run) return;
    const sec = $(CH[ci].scene);
    if (ci !== at.c || b === 0) resetCues(sec);
    if (ci === c) {
      CH[ci].beats.slice(0, b).forEach(x => { if (x[0] !== 'type') cueOn(sec, x[2]); });
      if (ci === 5 && b >= 4) sec.classList.add('c-black', 'c-endcard');
    }
    preload(idsOf(ci).concat(idsOf(ci + 1)));
    showScene(CH[ci].scene);
    if (ci !== c || b === 0) { capEl.textContent = ''; await wait(ci === c ? 300 : 700); }
    for (let bi = ci === c ? b : 0; bi < CH[ci].beats.length; bi++) {
      if (my !== run) return;
      at = { c: ci, b: bi };
      const r = await beat(ci, bi, my);
      if (my !== run) return;
      if (r === 'blocked') { blocked(); return; }
      await wait(320);
    }
    if (my !== run) return;
    mark(ci, CH[ci].beats.length);
    if (ci === CH.length - 1) { theDoor(); return; }
    await wait(500);
  }
}
/** the browser wants one tap inside the film before it speaks */
function blocked(){
  run++; voice('idle');
  showScene('s-start'); capEl.textContent = ''; sub('');
  $('play').hidden = false; $('pause').hidden = true;
}
/* ── the end: your tree. hold = heard (amber), let go = the door ── */
let holdAt = 0, holding = false;
// only a parent that speaks this film's language (it answered {voice:'need'}:
// veraldar.org) has a door to open; anywhere else the door is named, not faked
const hasDoor = () => inFrame && answered;
function theDoor(){
  ended = true; at = { c: CH.length - 1, b: 1 };
  document.body.classList.add('try');
  $('s-door').classList.add('try');
  $('pause').hidden = true; $('again').hidden = false; $('open').hidden = !hasDoor();
  sub(hasDoor() ? T.hold : T.elsewhere);
}
function treeDown(e){
  if (!ended || !hasDoor()) return;
  if (e && e.preventDefault) e.preventDefault();
  try { e && e.pointerId != null && $('doortree').setPointerCapture(e.pointerId); } catch (_) {}
  holding = true; holdAt = performance.now();
  document.body.classList.add('heard'); sub(T.heard, true);
}
function treeUp(){
  if (!holding) return;
  holding = false;
  document.body.classList.remove('heard');
  if (performance.now() - holdAt < 350) { sub(T.tap); return; }
  toDoor();
}
function toDoor(){ if (cut) cut(); run++; window.parent.postMessage({ film: 'door' }, '*'); }
const dt = $('doortree');
dt.addEventListener('pointerdown', treeDown);
dt.addEventListener('pointerup', treeUp);
dt.addEventListener('pointercancel', () => { if (holding) { holding = false; document.body.classList.remove('heard'); sub(T.hold); } });
dt.addEventListener('contextmenu', e => e.preventDefault());
dt.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) treeDown(e); });
dt.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') treeUp(); });
$('open').addEventListener('click', toDoor);
$('again').addEventListener('click', () => void playFrom(0, 0));
$('pause').addEventListener('click', () => {
  if (!paused) {
    paused = true; run++; if (cut) cut(); voice('idle'); document.body.classList.remove('heard');
    $('pause').textContent = T.resume; $('pause').setAttribute('aria-label', 'play');
  } else {
    void playFrom(at.c, at.b);
  }
});
$('pause').setAttribute('aria-label', 'pause');
$('play').addEventListener('click', () => { unlocked = true; void playFrom(Math.max(0, at.c), at.c < 0 ? 0 : at.b); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && inFrame) window.parent.postMessage({ film: 'skip' }, '*'); });

/* ── start ── */
chapters();
if (inFrame) window.parent.postMessage({ tree: 'up' }, '*'); // first paint: the parent's wait gives way
const startAt = Math.min(CH.length, Math.max(1, Number(Q.get('ch')) || 0)) - 1;
preload(idsOf(Math.max(0, startAt)).concat(idsOf(Math.max(0, startAt) + 1)));
titleEl.textContent = T.title;
if (startAt >= 0 && Q.get('ch')) void playFrom(startAt, 0);
else {
  // the manifesto opens the film (typed, as canon) while the first lines load
  const my = run;
  typeInto($('m0'), T.manifesto, my, 58).then(() => wait(900)).then(() => { if (my === run) void playFrom(0, 0); });
}
})();
</script>
