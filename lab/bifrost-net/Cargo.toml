[package]
name = "bifrost-net"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.23.1"
boringtun = "0.7.1"
etherparse = "0.21.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
str0m = "0.24.0"
tiny_http = "0.12.0"
toml = "1.1.6"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
opus = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sha1 = "0.10"
