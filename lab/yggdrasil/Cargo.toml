[package]
name = "yggdrasil"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
strip = true
